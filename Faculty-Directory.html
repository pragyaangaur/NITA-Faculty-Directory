<style>
body{
    font-family: system-ui, -apple-system, Arial;
    margin:0;
    background:#0b1220;
    color:#e5e7eb;
}

header{
    padding:30px 20px 10px;
    max-width:1100px;
    margin:auto;
}

h1{
    margin:0;
    font-size:28px;
}

.sub{
    color:#94a3b8;
    margin-top:6px;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

input,select{
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:#e5e7eb;
    outline:none;
}

input{
    flex:1;
    min-width:220px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:14px;
}

.card{
    background:#0f172a;
    border:1px solid #1f2937;
    border-radius:14px;
    padding:14px;
    transition:0.2s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:#334155;
}

.name{
    font-weight:600;
    font-size:16px;
}

.title{
    color:#93c5fd;
    font-size:13px;
    margin-top:4px;
}

.dept{
    color:#94a3b8;
    font-size:13px;
    margin-top:6px;
}

.email{
    margin-top:10px;
    font-size:13px;
    color:#60a5fa;
    word-break:break-all;
}
</style>
</head>

function titleCase(str){
    if(!str) return "";
    return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

facultyData.forEach(r=>{
    r.Name = titleCase(r.Name);
});

const grid = document.getElementById("grid");
const searchBox = document.getElementById("searchBox");
const deptFilter = document.getElementById("deptFilter");

const depts = [...new Set(facultyData.map(x => x.Department))].sort();

depts.forEach(d=>{
    const op = document.createElement("option");
    op.value = d;
    op.textContent = d;
    deptFilter.appendChild(op);
});

function render(data){
    grid.innerHTML = data.map(r=>`
        <div class="card">
            <div class="name">${r.Name || ""}</div>
            <div class="title">${r.Title || ""}</div>
            <div class="dept">${r.Department || ""}</div>
            <div class="email">✉ ${r.Email || ""}</div>
        </div>
    `).join("");
}

function filter(){

    const q = searchBox.value.toLowerCase();
    const dept = deptFilter.value;

    const filtered = facultyData.filter(r=>{

        const text = (
            (r.Name||"") + " " +
            (r.Title||"") + " " +
            (r.Department||"") + " " +
            (r.Email||"")
        ).toLowerCase();

        return text.includes(q) &&
               (dept === "" || r.Department === dept);
    });

    render(filtered);
}

searchBox.addEventListener("input", filter);
deptFilter.addEventListener("change", filter);

render(facultyData);
